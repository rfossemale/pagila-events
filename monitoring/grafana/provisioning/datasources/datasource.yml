# Datasource de Grafana provisionado automáticamente al arrancar.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # Enlaza los logs con las métricas (mismo rango temporal en Explore).
      maxLines: 1000

