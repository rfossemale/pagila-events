# Configuración de scrape de Prometheus para el stack pagila-events.
# Cada `job` define de dónde Prometheus lee métricas (pull cada 15s).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # El propio Prometheus (útil para verificar que está vivo).
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Producer NestJS. Usamos DNS service discovery (type A) sobre el hostname
  # `producer` para que, al escalar réplicas (`--scale producer=N`), Prometheus
  # descubra y scrapee TODAS las instancias, no solo una.
  - job_name: producer
    metrics_path: /api/metrics
    dns_sd_configs:
      - names: ['producer']
        type: A
        port: 3000

  # Consumer NestJS (instancia única).
  - job_name: consumer
    metrics_path: /metrics
    static_configs:
      - targets: ['consumer:3001']

  # Exporter de PostgreSQL (métricas de conexiones, locks, tamaño, etc.).
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Exporter de Redis (memoria, clientes, comandos, keyspace).
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
