# Load balancer para las réplicas del `producer`.
# Usa el resolver interno de Docker Compose (127.0.0.11) para resolver
# `producer` a las IPs de todas las réplicas y hacer round-robin.

# `resolver` con TTL corto para que nginx vea altas/bajas de réplicas
# (`docker compose up --scale producer=N`) sin reiniciarse.
resolver 127.0.0.11 valid=10s ipv6=off;

# Guardamos el upstream en una variable — así nginx re-resuelve el DNS en
# cada request en lugar de cachearlo al arrancar (que es lo que hace el
# bloque `upstream` clásico de open-source nginx).
map "" $producer_upstream {
  default producer:3000;
}

# Upstream de Grafana (instancia única) resuelto vía DNS de Docker.
map "" $grafana_upstream {
  default grafana:3000;
}

server {
  listen 80;
  server_name _;

  # Timeout generoso para operaciones largas (transacciones, colas).
  proxy_connect_timeout 5s;
  proxy_read_timeout    60s;
  proxy_send_timeout    60s;

  # Dashboard de Grafana bajo /grafana (Grafana está configurado con
  # GF_SERVER_SERVE_FROM_SUB_PATH, así que espera recibir el prefijo intacto).
  # Incluye los headers de upgrade para que funcione Grafana Live (WebSocket).
  location /grafana/ {
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }

  # Bull Board sirve assets estáticos + rutas anidadas; conviene explicitar
  # el prefix con trailing slash y pasar los headers estándar.
  location / {
    proxy_pass http://$producer_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
