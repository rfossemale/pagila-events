services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pagila # está usando user: 'postgres' definido en 00-init.sql
      POSTGRES_PASSWORD: pagila
      POSTGRES_DB: pagila
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagila -d pagila"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
      # Corta en el stage `builder` (tiene devDependencies incluido @nestjs/cli),
      # necesario para poder correr `npm run start:dev` con hot reload.
      target: builder
    environment:
      # DB (Postgres corre en el network compose → hostname `postgres`, puerto interno 5432)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pagila
      DB_PASSWORD: pagila
      DB_NAME: pagila
      # Redis (hostname `redis`)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Nest
      PORT: 3000
      NODE_ENV: development
    # Sin `ports:` para poder escalar (`--scale producer=N`) sin colisiones.
    # `expose` documenta el puerto interno; el acceso al host va vía nginx.
    expose:
      - "3000"
    volumes:
      - ./producer/src:/app/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/producer.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Único puerto expuesto al host: nginx balancea las réplicas del producer.
      - "3000:80"
    depends_on:
      - producer
      - grafana
    restart: unless-stopped

  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    environment:
      # Misma BD que el producer (el consumer escribe en el schema `consumer`)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pagila
      DB_PASSWORD: pagila
      DB_NAME: pagila
      # Redis para el BullMQ Worker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Nest
      PORT: 3001
      NODE_ENV: production
    # Movido fuera del rango 3000-3099 para evitar colisión con `--scale producer=N`.
    ports:
      - "3101:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped   

  # ── Observabilidad ──────────────────────────────────────────────────────
  # Exporter que traduce estadísticas de PostgreSQL a métricas Prometheus.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://pagila:pagila@postgres:5432/pagila?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Exporter que traduce el INFO de Redis a métricas Prometheus.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Prometheus: hace pull de /metrics de producer, consumer y los exporters.
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - producer
      - consumer
    restart: unless-stopped

  # Loki: almacén de logs (equivalente a Prometheus pero para líneas de log).
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Promtail: descubre los contenedores del stack y empuja sus logs a Loki.
  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Socket de Docker: Promtail lee los logs vía la API del daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  # Grafana: dashboards del sistema. Servido en subpath /grafana (vía nginx) y
  # también directo en el puerto 3002. Datasource y dashboard se provisionan solos.
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Acceso anónimo de sólo-lectura para poder ver el dashboard sin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Servir bajo el subpath /grafana para exponerlo detrás de nginx.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  loki-data: